<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conquered</title>
<style>
:root{--bg:#f5f5f0;--card:#f9f9f7;--ink:#3a3a36;--muted:#888878;--line:#e0e0d8;--accent:#5a5a4a;--good:#6b8c6a}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;font-family:monospace;color:var(--ink);font-size:13px}
body{display:flex;flex-direction:column;background:var(--bg)}
header{padding:12px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:16px}
#mapContainer{flex:1;width:100%;background:#dfe6e9}
</style>
</head>
<body>
<header>
  <h1>Conquered</h1>
  <div id="auth"></div>
</header>
<div id="mapContainer"></div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCkTOWPcSGNvApDDYUXFskZKvuqnOz5dw4"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA7gvfj8fVzphPPGRUfWXtLfwQ9cK3CAbE",
  authDomain: "conquered-sf.firebaseapp.com",
  projectId: "conquered-sf",
  storageBucket: "conquered-sf.appspot.com",
  messagingSenderId: "523098241849",
  appId: "1:523098241849:web:f4c3e5d7c8e2a1b0"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

let map, SEED = [], currentUser = null;
const $ = id => document.getElementById(id);

auth.onAuthStateChanged(user => {
  if(user) {
    currentUser = user;
    $("auth").innerHTML = `<span>${user.email}</span> <button onclick="logout()" style="margin-left:10px;padding:6px 12px;cursor:pointer">Logout</button>`;
    initMap();
    loadBars();
  } else {
    $("auth").innerHTML = `<button onclick="googleLogin()" style="padding:8px 16px;background:#5a5a4a;color:white;border:none;cursor:pointer">Sign in with Google</button>`;
  }
});

function googleLogin() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).catch(err => alert("Sign in error: " + err.message));
}

function logout() {
  auth.signOut();
}

function initMap() {
  map = new google.maps.Map($("mapContainer"), {
    center: {lat: 37.7749, lng: -122.4194},
    zoom: 12
  });
}

function loadBars() {
  fetch("data/bars_full.json")
    .then(r => r.json())
    .then(d => {
      SEED = Array.isArray(d) ? d : d.bars;
      displayBars();
    })
    .catch(err => console.error("Error loading bars:", err));
}

function displayBars() {
  SEED.forEach(bar => {
    const marker = new google.maps.Marker({
      position: {lat: bar.lat, lng: bar.lon},
      map: map,
      title: bar.name
    });
    marker.addListener("click", () => {
      new google.maps.InfoWindow({
        content: `<div style="padding:8px;max-width:250px"><strong>${bar.name}</strong><br><small>${bar.neighborhood}</small></div>`
      }).open(map, marker);
    });
  });
}
</script>
</body>
</html>
