<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Conquered</title>
<style>
body{margin:0;padding:0;font-family:monospace;height:100vh;display:flex;flex-direction:column}
header{padding:10px;border-bottom:2px solid #333;background:#f5f5f0;display:flex;justify-content:space-between}
#mapContainer{flex:1;background:#ddd}
.tabbar{position:fixed;bottom:0;left:0;right:0;height:60px;background:#f5f5f0;border-top:1px solid #ccc;display:flex;justify-content:space-around;padding:8px 0}
.tab{flex:1;text-align:center;cursor:pointer;padding:10px;border:none;background:none;font-family:monospace}
.tab.active{font-weight:bold;color:#5a5a4a}
</style>
</head>
<body>
<header>
  <h1>Conquered</h1>
  <div id="auth"></div>
</header>
<div id="mapContainer"></div>
<div class="tabbar">
  <button class="tab active" onclick="auth.signOut()">Logout</button>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCkTOWPcSGNvApDDYUXFskZKvuqnOz5dw4"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAq6Vtk7HsWQ7TYWG00pE_m06k428E9-lA",
  authDomain: "conquered-44781.firebaseapp.com",
  projectId: "conquered-44781",
  storageBucket: "conquered-44781.firebasestorage.app",
  messagingSenderId: "531077493851",
  appId: "1:531077493851:web:9f0542c4dd0919e13ffb7e"
});

const auth = firebase.auth();
const db = firebase.firestore();
let map, SEED = [], currentUser = null, visited = new Set(), currentInfoWindow = null;

auth.onAuthStateChanged(user => {
  currentUser = user;
  if(user) {
    document.getElementById("auth").innerHTML = user.email + ' <button onclick="auth.signOut()">Logout</button>';
    loadUserData();
    setTimeout(() => initMap(), 100);
  } else {
    document.getElementById("auth").innerHTML = '<button onclick="firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())">Sign In</button>';
  }
});

function loadUserData() {
  if(!currentUser) return;
  db.collection("users").doc(currentUser.uid).get().then(doc => {
    if(doc.exists) visited = new Set(doc.data().visited || []);
    loadBars();
  });
}

function initMap() {
  map = new google.maps.Map(document.getElementById("mapContainer"), {
    center: {lat: 37.7749, lng: -122.4194},
    zoom: 12
  });
}

function loadBars() {
  fetch("data/bars_full.json")
    .then(r => r.json())
    .then(d => {
      SEED = Array.isArray(d) ? d : d.bars;
      if(map) showBars();
    });
}

function showBars() {
  SEED.forEach(bar => {
    const isDone = visited.has(bar.name + "|" + bar.neighborhood);
    const marker = new google.maps.Marker({
      position: {lat: bar.lat, lng: bar.lon},
      map: map,
      title: bar.name,
      icon: isDone ? "https://maps.google.com/mapfiles/ms/icons/green-dot.png" : "https://maps.google.com/mapfiles/ms/icons/red-dot.png"
    });
    
    const infoWindow = new google.maps.InfoWindow({
      content: '<div style="padding:8px"><strong>' + bar.name + '</strong><br><small>' + bar.neighborhood + '</small></div>'
    });
    
    marker.addListener("click", () => {
      if(currentInfoWindow) currentInfoWindow.close();
      infoWindow.open(map, marker);
      currentInfoWindow = infoWindow;
    });
  });
}
</script>
</body>
</html>
